<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 15px; font-family: Arial, sans-serif; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .result-box { margin-top: 15px; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; }
    .status-safe { background-color: #d4edda; color: #155724; }
    .status-spam { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h3>Cyber Threat Detector</h3>
  <textarea id="inputText" placeholder="Masukkan link atau teks..."></textarea>
  <button id="analyzeBtn">Analisis Keamanan</button>
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
