<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cyber Threat Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e293b;
    }
    .title { font-size: 14px; font-weight: 700; color: #60a5fa; }
    .subtitle { font-size: 10px; color: #94a3b8; }
    .badge {
      background: rgba(96, 165, 250, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
    textarea {
      width: 100%;
      height: 70px;
      padding: 8px 10px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    .result-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      display: none;
    }
    .status-spam {
      background-color: rgba(127, 29, 29, 0.4);
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }
    .status-ham {
      background-color: rgba(6, 78, 59, 0.4);
      border: 1px solid rgba(34, 197, 94, 0.6);
      color: #86efac;
    }
    .status-loading {
      background-color: rgba(51, 65, 85, 0.5);
      border: 1px solid #475569;
      color: #cbd5e1;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="title">🛡️ Threat Detector</div>
      <div class="subtitle">AI Protection Extension</div>
    </div>
    <span class="badge">v1.0</span>
  </div>

  <div>
    <label for="inputText">Teks / Link Suspisius</label>
    <textarea id="inputText" placeholder="Paste link atau pesan ajakan di sini..."></textarea>
    <button id="checkBtn">🔍 Analisis Keamanan</button>
  </div>

  <div id="result" class="result-box"></div>

  <script src="popup.js"></script>
</body>
</html>
