<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; }
    h3 { margin-top: 0; color: #333; text-align: center; }
    textarea { width: 100%; height: 80px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; padding: 8px; resize: none; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
    button:hover { background-color: #0056b3; }
    .btn-download { background-color: #28a745; text-decoration: none; display: block; text-align: center; color: white; padding: 9px; border-radius: 6px; font-weight: bold; font-size: 13px; }
    .btn-download:hover { background-color: #218838; }
    .result-box { margin: 10px 0; padding: 10px; border-radius: 6px; font-weight: bold; text-align: center; font-size: 13px; }
    .status-safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-spam { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .footer { margin-top: 12px; border-top: 1px solid #eee; pt: 10px; }
  </style>
</head>
<body>
  <h3>Cyber Threat Detector</h3>
  <textarea id="inputText" placeholder="Masukkan link/teks atau blok teks di halaman web..."></textarea>
  <button id="analyzeBtn">Analisis Keamanan</button>
  
  <div id="result"></div>

  <div class="footer">
    <a id="downloadBtn" class="btn-download" href="#" download>📥 Download File Pelengkap</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
